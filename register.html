<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tixify - Registrierung</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">
        <a href="index.html"><h1>Tixify</h1></a>
      </div>
      <nav>
        <a href="index.html">Events</a>
        <a href="cart.html">Warenkorb</a>
        <a href="login.html">Login</a>
        <a href="register.html" class="active">Registrieren</a>
      </nav>
    </header>

    <main class="container">
      <div class="auth-card">
        <h2>Konto erstellen</h2>
        <form id="form-register">
          <div class="form-group">
            <label for="reg-username">Benutzername</label>
            <input
              type="text"
              id="reg-username"
              required
              placeholder="max_mustermann"
            />
          </div>
          <div class="form-group">
            <label for="reg-email">E-Mail Adresse</label>
            <input
              type="email"
              id="reg-email"
              required
              placeholder="max@example.com"
            />
          </div>
          <div class="form-group">
            <label for="reg-password">Passwort</label>
            <input type="password" id="reg-password" required minlength="6" />
          </div>
          <button type="submit" class="btn-primary">Registrieren</button>
        </form>
        <p style="margin-top: 1rem">
          Bereits ein Konto? <a href="login.html">Hier einloggen</a>
        </p>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
