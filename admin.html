<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Tixify – Eventverwaltung</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .admin-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .modal-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(3px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }
      .modal-backdrop.is-open {
        display: flex;
      }
      .modal-dialog {
        background: #ffffff;
        width: 100%;
        max-width: 540px;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        position: relative;
      }
      .modal-close-btn {
        position: absolute;
        top: 18px;
        right: 20px;
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #666;
      }
      .modal-form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 14px;
      }
      .modal-form-grid .full-width {
        grid-column: span 2;
      }
      .modal-form-grid label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .modal-form-grid input,
      .modal-form-grid textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-family: inherit;
      }
      .action-buttons {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .button--danger {
        color: #dc2626;
        border-color: #fca5a5;
      }
      .button--danger:hover {
        background: #fee2e2;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__container">
        <a href="index.html" class="brand-logo">Tix<i>ify</i></a>
        <nav class="nav-menu">
          <a href="index.html" class="nav-menu__link">Event-Suche</a>
          <a href="bookings.html" class="nav-menu__link">Meine Buchungen</a>
          <a href="admin.html" class="nav-menu__link nav-menu__link--active"
            >Eventverwaltung</a
          >
          <a href="login.html" class="nav-menu__link">Profil (Abmelden)</a>
        </nav>
      </div>
    </header>

    <main class="page-container">
      <div class="admin-header-row">
        <div>
          <h1 style="margin: 0">Eventverwaltung</h1>
          <p class="text-muted" style="margin: 4px 0 0 0">
            Alle Veranstaltungen im System einsehen, anpassen oder erstellen.
          </p>
        </div>
        <button class="button" id="open-create-modal-btn">
          + Neues Event erstellen
        </button>
      </div>

      <div
        class="card-box"
        style="padding: 0; overflow: hidden; margin-top: 16px"
      >
        <table
          class="data-table"
          style="width: 100%; border-collapse: collapse"
        >
          <thead>
            <tr>
              <th>ID</th>
              <th>Titel & Ort</th>
              <th>Kategorie</th>
              <th>Datum</th>
              <th>Preis</th>
              <th>Bestand</th>
              <th style="text-align: right; padding-right: 18px">Aktionen</th>
            </tr>
          </thead>
          <tbody id="admin-events-tbody">
            <tr>
              <td colspan="7" style="text-align: center; padding: 24px">
                Lade Events...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <div class="modal-backdrop" id="event-modal">
      <div class="modal-dialog">
        <button class="modal-close-btn" id="modal-close-btn">&times;</button>
        <h2 id="modal-title" style="margin-top: 0">Event anlegen</h2>

        <form id="event-form">
          <input type="hidden" id="event-id" />

          <div class="modal-form-grid">
            <div class="full-width">
              <label for="event-title">Titel</label>
              <input
                type="text"
                id="event-title"
                required
                placeholder="z. B. Rock am Ring 2027"
              />
            </div>

            <div>
              <label for="event-category">Kategorie</label>
              <input
                type="text"
                id="event-category"
                placeholder="z. B. Festival, Konzert"
              />
            </div>

            <div>
              <label for="event-location">Ort / Location</label>
              <input
                type="text"
                id="event-location"
                required
                placeholder="z. B. Nürburgring"
              />
            </div>

            <div>
              <label for="event-date">Datum</label>
              <input type="date" id="event-date" required />
            </div>

            <div
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"
            >
              <div>
                <label for="event-price">Preis (€)</label>
                <input
                  type="number"
                  id="event-price"
                  step="0.01"
                  min="0"
                  required
                  placeholder="199.99"
                />
              </div>
              <div>
                <label for="event-stock">Bestand</label>
                <input
                  type="number"
                  id="event-stock"
                  min="0"
                  required
                  placeholder="500"
                />
              </div>
            </div>

            <div class="full-width">
              <label for="event-description">Beschreibung</label>
              <textarea
                id="event-description"
                rows="3"
                placeholder="Optionale Beschreibung zum Event..."
              ></textarea>
            </div>
          </div>

          <div
            style="
              display: flex;
              justify-content: flex-end;
              gap: 10px;
              margin-top: 20px;
            "
          >
            <button
              type="button"
              class="button button--outline"
              id="modal-cancel-btn"
            >
              Abbrechen
            </button>
            <button type="submit" class="button" id="modal-save-btn">
              Speichern
            </button>
          </div>
        </form>
      </div>
    </div>

    <footer class="site-footer" style="margin-top: 50px">
      <div class="site-footer__bottom">
        © 2026 Tixify · Fallstudie Software Engineering, WWI25A
      </div>
    </footer>

    <script type="module" src="js/common.js"></script>
    <script type="module" src="js/admin.js"></script>
  </body>
</html>
