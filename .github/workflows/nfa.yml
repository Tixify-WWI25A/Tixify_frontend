
# NFA US-05: misst die Ladezeit der Eventliste im echten Browser gegen das Live-System.
# Läuft nach jedem Pages-Deploy, täglich und auf Knopfdruck. KI-Log Nr. 19.
name: NFA Ladezeit
 
on:
  workflow_run:
    workflows: ["MPA auf GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "17 6 * * *" # täglich 06:17 UTC
  workflow_dispatch:
 
jobs:
  nfa:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Ladezeit messen (5 Aufrufe, Grenze 1,5 s)
        run: npx playwright test
        env:
          MPA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfa-bericht
          path: playwright-report
 