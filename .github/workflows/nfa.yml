
# Oberflächentests im echten Browser gegen das Live-System: NFA US-05 (Ladezeit, gegen die echte API),
# US-07 mobil bei 375 px und Schutz vor Schadcode (beide mit festen Testdaten statt der echten API).
# Läuft nach jedem Pages-Deploy, täglich und auf Knopfdruck. KI-Log Nr. 19 und 27.
name: Oberflächentests
 
on:
  workflow_run:
    workflows: ["MPA auf GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "17 6 * * *" # täglich 06:17 UTC
  workflow_dispatch:
 
jobs:
  nfa:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Ladezeit (Grenze 1,5 s), mobile Ansicht (375 px) und XSS-Schutz prüfen
        run: npx playwright test
        env:
          MPA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfa-bericht
          path: playwright-report
 